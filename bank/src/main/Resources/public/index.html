<!DOCTYPE html>
<html lang="en">
<head>
    <title>Home</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <!-- <link rel="stylesheet" type="text/css" href="./assets/style.css"> -->
</head>
<body>
    <main>
        <div class="about">
            <h1>Banking Login</h1>
            <p>Styling will be coming soon! Please still trust us with your money despite the look.</p>
            <p>(I used some code from previous projects to create a skeleton for this login system. I plan on changing this to better reflect a login!)</p>

                <form action="/account.html" method="GET" onsubmit="return validateForm()">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" placeholder="First-name Last-name" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="someone@insight.com" required>

                    <label for="phoneNum">Phone Number:</label>
                    <input type="tel" id="phoneNum" name="phoneNum" placeholder="111-111-1111" required>

                    <input type="submit" value="Send">
                </form>
            </div>

    </main>
</body>
</html>
